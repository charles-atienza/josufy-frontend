<div class="card" style="width: 18rem" (click)="onClick()">
  <div [className]="isComingSoon ? 'coming-soon' : ''">
    <div class="p-3">
      <img [src]="logoURI" class="card-img-top" alt="..." />
    </div>
    <div class="card-body text-center">
      <p class="card-text fw-semibold text-uppercase">{{ title }}</p>
    </div>
  </div>
</div>
